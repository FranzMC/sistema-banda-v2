components:
  schemas:
    AbonoDeuda:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        deuda_motivo:
          type: string
          readOnly: true
        musico_nombre:
          type: string
          readOnly: true
        monto:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        fecha:
          type: string
          format: date
        deuda:
          type: integer
        planilla:
          type: integer
          nullable: true
      required:
      - deuda
      - deuda_motivo
      - id
      - monto
      - musico_nombre
    Adelanto:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        musico_nombre:
          type: string
          readOnly: true
        monto:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        motivo:
          type: string
          maxLength: 200
        fecha:
          type: string
          format: date
        origen:
          $ref: '#/components/schemas/OrigenEnum'
        estado:
          $ref: '#/components/schemas/Estado735Enum'
        creado_en:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        musico:
          type: integer
        contrato:
          type: integer
          nullable: true
        registrado_por:
          type: integer
          nullable: true
      required:
      - creado_en
      - id
      - monto
      - motivo
      - musico
      - musico_nombre
    Asistencia:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        musico_nombre:
          type: string
          readOnly: true
        evento_titulo:
          type: string
          readOnly: true
        estado:
          $ref: '#/components/schemas/AsistenciaEstadoEnum'
        hora_llegada:
          type: string
          format: time
          nullable: true
        observaciones:
          type: string
        fecha_asistencia:
          type: string
          format: date
          description: Fecha específica de asistencia (para eventos multi-día)
        monto_acordado:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Pago asignado por el directorio para este día específico
        liquidado:
          type: boolean
          description: Indica si este día ya fue pagado
        musico:
          type: integer
        evento:
          type: integer
        contrato:
          type: integer
          nullable: true
          description: Contrato personalizado para este evento
      required:
      - evento
      - evento_titulo
      - id
      - musico
      - musico_nombre
    AsistenciaEstadoEnum:
      enum:
      - PRESENTE
      - TARDANZA
      - AUSENTE
      - JUSTIFICADO
      type: string
      description: |-
        * `PRESENTE` - Presente
        * `TARDANZA` - Tardanza
        * `AUSENTE` - Ausente
        * `JUSTIFICADO` - Justificado
    CampanaCanaston:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        titulo:
          type: string
          maxLength: 200
        fecha_inicio_calculo:
          type: string
          format: date
          description: Fecha inicio para cálculo de rendimiento
        fecha_fin_calculo:
          type: string
          format: date
          description: Fecha fin para cálculo de rendimiento
        fecha_entrega:
          type: string
          format: date
          nullable: true
          description: Fecha prevista para entrega de canastones
        estado:
          $ref: '#/components/schemas/CampanaCanastonEstadoEnum'
        observaciones:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - fecha_fin_calculo
      - fecha_inicio_calculo
      - id
      - titulo
    CampanaCanastonEstadoEnum:
      enum:
      - ABIERTO
      - CERRADO
      type: string
      description: |-
        * `ABIERTO` - Abierto
        * `CERRADO` - Cerrado
    ConfiguracionSistema:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre_banda:
          type: string
          maxLength: 200
        monto_por_evento:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        hora_limite_tardanza:
          type: string
          format: time
        email_director:
          type: string
          format: email
          maxLength: 254
        telefono_contacto:
          type: string
          maxLength: 20
      required:
      - id
    ContratoMusico:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        musico_nombre:
          type: string
          readOnly: true
        evento_titulo:
          type: string
          readOnly: true
        aprobado_por_nombre:
          type: string
          readOnly: true
        monto_total_calculado:
          type: string
