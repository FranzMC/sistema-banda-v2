services:
  - type: web
    name: sis-banda-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true

  - type: web
    name: sis-banda-api
    runtime: python
    plan: free
    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      (python seed_modulos.py || true) &&
      (python create_admin.py || true)
    startCommand: gunicorn core.wsgi:application --workers 2 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/
    autoDeploy: true
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: sis-banda-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://sis-banda-frontend.onrender.com,https://sis-banda.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: sis-banda-db
          property: connectionString
      - key: ACCESS_TOKEN_LIFETIME
        value: "3600"
      - key: REFRESH_TOKEN_LIFETIME
        value: "2592000"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: PYTHON_VERSION
        value: "3.11.9"

databases:
  - name: sis-banda-db
    plan: free
